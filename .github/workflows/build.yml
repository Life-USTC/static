name: Update Repo

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [retry_job]

permissions:
  actions: read
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: |
          uv sync --no-dev
          uv run --no-dev patchright install chromium
      - name: Restore previous Pages artifact cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --branch master \
            --status success \
            --limit 7 \
            --json databaseId \
            --jq '.[].databaseId')
          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "No previous successful build artifact found"
            exit 0
          fi

          mkdir -p build
          for run_id in "${run_ids[@]}"; do
            rm -rf /tmp/previous-pages
            mkdir -p /tmp/previous-pages
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name github-pages \
              --dir /tmp/previous-pages &&
              test -f /tmp/previous-pages/artifact.tar; then
              tar -xf /tmp/previous-pages/artifact.tar -C build
              echo "Restored previous build artifact $run_id"
              exit 0
            fi
            echo "::warning title=Previous build cache unavailable::Artifact from run $run_id could not be restored"
          done
          echo "::warning title=Incremental cache unavailable::No recent successful Pages artifact could be restored; running a full rebuild"
      - name: Run Program
        env:
          TZ: "Asia/Shanghai"
          USTC_PASSPORT_USERNAME: ${{ secrets.USTC_PASSPORT_USERNAME }}
          USTC_PASSPORT_PASSWORD: ${{ secrets.USTC_PASSPORT_PASSWORD }}
          USTC_PASSPORT_TOTP_URL: ${{ secrets.USTC_PASSPORT_TOTP_URL }}
        run: |
          uv run --no-dev python main.py
      - name: Verify SQLite snapshots and schemas
        run: |
          uv run --no-dev python tools/verify_build.py
      - name: Prepare Pages artifact
        run: |
          find build -name '*.observed.schema.json' -delete
          find build -name 'contract-report.json' -delete
          test -z "$(find build -name '*.observed.schema.json' -o -name 'contract-report.json')"
          touch build/.nojekyll
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
