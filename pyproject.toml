[project]
name = "static"
version = "0.1.0"
description = "School catalog, timetable and activity snapshots for Life@USTC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "patchright>=1.64.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyotp>=2.12.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "ruff>=0.17.4",
    "ty>=0.0.107",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["build", "static"]
lint.select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"src/models/*.py" = ["N815"]
"src/utils/catalog.py" = ["N806"]
"src/utils/jw.py" = ["N802", "N806", "N816"]
"tools/bus_data_gen.py" = ["N816"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
